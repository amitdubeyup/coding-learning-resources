name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the CURRENT working tree only (`dir`), not git history.
      # Rationale: git history contains a since-rotated credential; scanning
      # history would fail the build with no security benefit. This still
      # catches any secret committed into current files going forward.
      # If you ever purge history, switch `dir /repo` to `git /repo` to also
      # scan commits.
      - name: Run gitleaks (no history)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest dir /repo --redact

  python-quality:
    name: Python lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check . || true   # non-blocking until the codebase is clean
      - name: Byte-compile all Python
        run: python -m compileall -q projects

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" || true
